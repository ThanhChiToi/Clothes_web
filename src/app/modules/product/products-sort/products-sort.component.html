<div class="product-page">
    <div class="container my-5">
        <h1 class="fw-bold text-uppercase fs-2 mb-4">Sản Phẩm Nổi Bật</h1>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 g-md-4">
            @for (product of products; track product.id) {
            <div class="col">
                <div class="card custom-shaped-card">

                    <!-- Badge tin tức / giảm giá nếu có -->
                    @if (product.isNew) {
                    <span class="badge bg-danger position-absolute top-0 start-0 m-3 z-3">NEW</span>
                    }

                    <!-- Khung ảnh hiệu ứng Image Swap + Zoom -->
                    <div [routerLink]="['/products', product.id]" class="img-limit">
                        <img [src]="product.primaryImg" [alt]="product.name" class="img-primary">
                        <img [src]="product.hoverImg" [alt]="product.name + ' - Hover'" class="img-hover">
                    </div>

                    <!-- Thông tin sản phẩm -->
                    <div class="card-body d-flex flex-column justify-content-between p-3">
                        <div>
                            <h3 class="card-title product-title text-truncate-2 fs-6 mb-2">
                                <a href="#" class="text-decoration-none text-dark">{{ product.name }}</a>
                            </h3>
                        </div>

                        <div class="product-price-box d-flex align-items-baseline gap-2 mt-auto">
                            <span class="price-current fw-bold text-base fs-6">
                                {{ product.price | currency:'VND':'symbol':'1.0-0' }}
                            </span>
                            @if (product.originalPrice) {
                            <span class="price-old text-muted text-decoration-line-through small">
                                {{ product.originalPrice | currency:'VND':'symbol':'1.0-0' }}
                            </span>
                            }
                        </div>
                    </div>

                </div>
            </div>
            }
        </div>
    </div>
</div>
